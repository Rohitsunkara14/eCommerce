<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Details — ShopEase</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="logo">ShopEase</a>
    <div class="nav-links">
      <a href="index.html">Shop</a>
      <a href="cart.html" class="cart-link">Cart <span id="cart-count">0</span></a>
      <div id="nav-auth-area"></div>
    </div>
  </div>
</header>

<main class="container">
  <div id="product-detail" class="product-detail-wrap">
    <p>Loading...</p>
  </div>

  <section class="reviews-section">
    <h2>Reviews</h2>
    <div id="review-list"></div>

    <h3 style="margin-top:24px;">Leave a Review</h3>
    <form id="review-form">
      <select id="review-rating" required>
        <option value="5">5 - Excellent</option>
        <option value="4">4 - Good</option>
        <option value="3">3 - Average</option>
        <option value="2">2 - Poor</option>
        <option value="1">1 - Terrible</option>
      </select>
      <textarea id="review-comment" rows="3" placeholder="Share your thoughts..." required></textarea>
      <button type="submit" class="btn btn-primary">Submit Review</button>
    </form>
  </section>
</main>

<footer>&copy; 2026 ShopEase. Built as a learning project.</footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/products.js"></script>
</body>
</html>
